# Digest lock for the derived-inputs GHCR cache (see #42).
#
# One entry per line: `<ref> sha256:<64 hex>`. `dcache_require` (in
# builder/stage-lib/derive-cache.sh) is called by each of the seven derive
# scripts right after a `dcache_pull` miss:
#   - ref PRESENT here + miss  -> fatal: the entry we depend on is gone.
#   - ref ABSENT here + miss   -> not fatal: a new image, or a deliberate
#     RECIPE bump, is expected to derive from scratch.
#   - ALLOW_DERIVE_CACHE_MISS=1 downgrades a pinned-miss failure to a
#     warning on stderr (escape hatch for a GHCR outage — see
#     .github/workflows/build.yml's workflow_dispatch input).
#
# WHAT IS ENFORCED. Both columns, in two different places, because a miss and
# a hit are different failures:
#   - the REF, by `dcache_require`, on a miss (above);
#   - the DIGEST, by `dcache_pull`, on a HIT: the manifest the tag resolves to
#     is hashed and compared against the digest here BEFORE any blob is
#     fetched, and a mismatch is fatal. That closes the chain — the manifest
#     names every layer by sha256, and the fetch refuses a blob whose bytes
#     disagree, so a matching digest here means every byte extracted is the
#     reviewed byte. A tag is mutable; this is what makes an entry not.
#
# If an entry is legitimately re-pushed its digest changes and every build
# fails until this file is updated. That is the intended cost: updating it is
# a reviewed diff, which is the only reason to check a lock in at all. There
# is deliberately no CI escape hatch for a mismatch — ALLOW_DERIVE_CACHE_MISS
# covers a GHCR outage, which is a different thing entirely, and only
# ALLOW_DERIVE_CACHE_DIGEST_MISMATCH=1 (for re-pinning by hand) downgrades a
# mismatch to a warning. A ref listed with no digest column is still pinned
# for the miss check and simply skips the comparison.
#
# Every digest below was re-resolved against the LIVE registry on 2026-08-11,
# never invented or copied from a log: a bearer token was minted from
# `gh auth token` via https://ghcr.io/token, then each ref's manifest was
# fetched from https://ghcr.io/v2/shkolnik/<package>/manifests/<tag> with
# Accept listing the OCI manifest, the OCI index and the Docker v2 manifest
# types (the wrong Accept header silently returns a different manifest, and
# therefore a different, WRONG digest). For ALL SEVEN the Docker-Content-Digest
# response header was cross-checked against sha256 of the raw manifest body and
# matched exactly, and all seven reported
# `artifactType: application/vnd.unknown.artifact.v1` — that is the check that
# says the fleet has fully converted and the legacy reader could be deleted.
#
# Wikipedia was the last entry to convert, and it did not convert the way the
# others did: its ~95 GB of parts were fetched blob-by-blob from the legacy
# manifest, verified against the ZIM pin in image.toml, and republished through
# `dcache_push` (PR #34). Its previous legacy manifest,
# sha256:1de4846366e0ac1940e486e5f48463ae27cbe7f9937fac1db42ec8915fe1d2c6, was
# the recovery handle for that republish and is GONE as of 2026-08-12 — deleted
# with the rest of the pre-ORAS versions, and confirmed 404. There is no second
# copy of this dataset anywhere: the entry pinned below is now the only thing
# standing between the fleet and the most expensive miss it has, a ~24-hour,
# ~95 GB upstream fetch, since the lab mirror is gone from its manifest too.
# Treat this line as load-bearing — do not delete, re-tag or re-push this entry
# without first putting the bytes somewhere else.

