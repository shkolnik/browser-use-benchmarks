# VisualWebArena — Shopping. 466 tasks against the Magento OneStopMarket
# storefront. This repo does not build that service: see [requires].
#
# Three sibling suite directories rather than one manifest with three sections:
# task_id restarts at 0 in every VWA task file (classifieds 0-233, shopping
# 0-465, reddit 0-209), so the directory is the only thing that disambiguates
# them. A capture keyed on task_id alone merges three suites into one and the
# collision is silent — every id in 0-209 exists three times.

[suite]
name = "shopping"
benchmark = "vwa"
# len(json.load(open("tasks.raw.json"))). Array position equals task_id on every
# record, which is why upstream's generator can name the per-task file it emits
# after the index; nothing enforces that, so the id is read from the record.
task_count = 466
description = "VisualWebArena Shopping: 466 multimodal tasks over the Magento OneStopMarket storefront, 169 of them carrying input images."

[upstream]
repo = "https://github.com/web-arena-x/visualwebarena"
# A commit, never a branch: `main` moves and the task set with it. Every file
# listed below is byte-identical to this tree.
commit = "89f5af29305c3d1e9f97ce4421462060a70c9a03"
license = "MIT"
# LICENSE.upstream is upstream's LICENSE verbatim; the copyright line reads
# "Copyright (c) 2024 Jing Yu Koh, Robert Lo, Lawrence Jang, Vikram Duvvur,
# Ming Chong Lim, and Po-Yu Huang".

# Paths are relative to the benchmark directory (tasks/vwa/), so the scoring
# code shared by all three suites is named the same way in all three manifests.
# The duplication is deliberate: the alternative is a fourth file that all three
# depend on, and a wrong edit there moves every suite at once.
[[upstream.files]]
path = "shopping/tasks.raw.json"
upstream_path = "config_files/vwa/test_shopping.raw.json"
sha256 = "beb9fc27d90406131f11442cc9518facdefc2c4845b5648f4934921aee4afa90"
bytes = 714795

[[upstream.files]]
path = "upstream/evaluation_harness/evaluators.py"
upstream_path = "evaluation_harness/evaluators.py"
sha256 = "00419191831d8a4d5260b7e742b964992acb95c4846864f46b7017ef8ca89f34"
bytes = 24229

[[upstream.files]]
path = "upstream/evaluation_harness/helper_functions.py"
upstream_path = "evaluation_harness/helper_functions.py"
sha256 = "984b81b540deb13acea1695f7cf02bec9ddca81ff4b8e831a03dafa2c948196d"
bytes = 20449

[[upstream.files]]
path = "upstream/evaluation_harness/image_utils.py"
upstream_path = "evaluation_harness/image_utils.py"
sha256 = "ad6edd1619e51bb4b35626cc49fff9f3da9013b9e77c37f8db7be376073d7241"
bytes = 2685

[[upstream.files]]
path = "upstream/browser_env/env_config.py"
upstream_path = "browser_env/env_config.py"
sha256 = "c98490c36eb7d3bc14eb5766dcbb445b68e1262b39ad41025bc941df9ec4b444"
bytes = 3128

[[upstream.files]]
path = "upstream/scripts/generate_test_data.py"
upstream_path = "scripts/generate_test_data.py"
sha256 = "63937e02860825bac7e9f66b82e081df8f09476cc88b44c5ff66726753fbd3ad"
bytes = 2225

[[upstream.files]]
path = "LICENSE.upstream"
upstream_path = "LICENSE"
sha256 = "a05020744efd1a76f94a3788a9ab9798160ac1a94b3e3adc6cea19fba59af39e"
bytes = 1128

# The archive these files come out of is pinned in tasks/vwa/datasets.toml and
# only there: all three VWA suites take their images from one tarball, and a
# second copy of that sha256 is a silent-wrong-data hole rather than redundancy
# (docs/design.md). fetch-images.py, beside that pin, verifies the tarball and
# unpacks the members named below into the gitignored datasets/ directory.
# bin/build never sees any of it: builder/discover.py globs images/*/*/image.toml
# and a tasks-side dataset is structurally invisible to it.
[[external_pins]]
what = "the 189 input images this suite references"
pinned_at = "tasks/vwa/datasets.toml"

[tasks]
file = "tasks.raw.json"
# The raw form, with __TOKEN__ placeholders intact. Upstream .gitignores the
# substituted per-task JSONs; substituting at capture time would bake one
# deployment's hostnames into git.
format = "json_array"
# The instruction is a literal string on the record: `intent`, already
# instantiated from `intent_template` + `instantiation_dict`. Nothing re-renders
# the template at run time, so `intent` is the text the agent sees.
instruction_source = "literal"
instruction_field = "intent"
# 53 tasks carry viewport_size and they do not agree about what it means: 49
# give WIDTH ONLY ({"width": 1280}) and 4 give both. Upstream merges it over the
# run-wide default (dict.update), so the 49 take their height from the harness
# while the 4 are deliberately mobile — {430x932} twice, {844x393}, {896x414}.
# Applying it as a replacement silently un-mobiles those four.
viewport_overrides = 53
viewport_mobile_tasks = 4
# ⚠️ 20 records carry a TOP-LEVEL reference_url alongside eval.reference_url,
# and it is the empty string on all 20. URLExactEvaluator reads
# eval.reference_url; a reader that takes the top-level one scores those tasks
# against an empty gold URL.
vestigial_top_level_reference_url = 20
# Annotator labels present on every record and read by no evaluator:
# reasoning_difficulty (easy 172 / medium 162 / hard 131, and one record whose
# value is the typo "hrad"), visual_difficulty, overall_difficulty (medium 211 /
# hard 147 / easy 108). `comments` is present on 453 of the 466.

# The per-task input images. 169 tasks carry 189 references between them: 145
# hold a bare string, 6 a one-element list, 16 a two-element list and 2 a
# three-element list. A reader that takes only the first entry loses 20 images;
# one that assumes a string loses all 44 in the 24 list-valued records.
[tasks.images]
count_tasks = 169
count_refs = 189
bytes = 91359300
# Where this suite's files sit inside the archive, under its archive_prefix.
# count_refs is also the number of files under this prefix: all 189 referenced
# paths resolve, and nothing under the prefix is unreferenced.
member_prefix = "environment_docker/webarena-homepage/static/input_images/shopping/"
# Two of VWA's three "no image" encodings appear here and they are not
# interchangeable: the `image` key is ABSENT on 273 records and explicitly null
# on 24. (The third, an empty list, occurs only in the reddit suite.)
# `_c.get("image", None)` returns None for both of these, but returns [] for the
# reddit case, so a `is not None` guard and a truthiness guard disagree.
no_image_absent = 273
no_image_null = 24
# Repo-root-relative, and upstream opens them with a bare Image.open() — run
# from any other directory and the task silently becomes text-only. It still
# scores, at 0, with no error naming the image.
path_template = "environment_docker/webarena-homepage/static/input_images/shopping/task_<task_id>/input_<n>.png"
# The extension is not the format: of the 189 files, 187 are JPEG and 2 are
# WebP, all named .png. Dispatching on the extension, or setting an image/png
# MIME type on an API upload, sends the wrong thing for every one of them.
formats = { jpeg = 187, webp = 2 }
# Largest file 2,104,252 bytes; largest by pixels 6960x4640 (task_178).
largest_bytes = 2104252

[addressing]
# Every start_url part in this file begins with a placeholder token, so the
# origin travels on the record and the deployment supplies only what the token
# stands for. Nothing has to be inferred from the instance key.
kind = "start_url_field"
field = "start_url"
# In band and not a placeholder: " |AND| " splits start_url into one browser tab per
# URL — 7 tasks here, 8 occurrences, so one task opens three tabs. Splitting on the bare
# "|AND|" leaves stray spaces inside the URLs. The suite's other in-band separator is a
# scoring concern and lives in [scoring.alternatives].
separator = " |AND| "

# Placeholder token -> the service name it stands for, "<benchmark>/<service>"
# as the directories under images/ are named. Upstream substitutes these with a
# whole-file str.replace over the file TEXT before json.loads, so a substituted
# value containing a quote or a backslash corrupts the JSON rather than failing
# a URL. Unlike WebArena's map, no VWA token is a prefix of another
# (__SHOPPING_ADMIN__ is not in the VWA replace map and occurs 0 times here), so
# the replacement order is not load-bearing in this suite.
[addressing.sites]
# Named here because tasks reference it, not because this repo builds it — see
# [requires].not_built.
"__SHOPPING__" = "vwa/shopping"
# The wikipedia this benchmark wants is the one this repo already builds for
# WebArena: both task URLs address the ZIM by name,
# /wikipedia_en_all_maxi_2022-05/A/Wagyu and .../I/Country_calling_codes_map
# .svg.png.webp, which is the archive images/webarena/wikipedia serves, on
# published port 9888 rather than upstream's 8888. kiwix-serve is pinned at
# 3.3.0 for exactly this reason: 3.4 changes the URL scheme, and these paths are
# the URL scheme.
"__WIKIPEDIA__" = "webarena/wikipedia"
# __CLASSIFIEDS__, __REDDIT__ and __HOMEPAGE__ occur 0 times in this file, and
# none of them is a service this suite needs. They are still environment
# variables the scoring chain cannot import without: see
# [requires].required_env, which a shopping-only deployment has to satisfy in
# full — CLASSIFIEDS and CLASSIFIEDS_RESET_TOKEN included.

[addressing.substitution]
kind = "whole_file_str_replace"
applied_by = "upstream/scripts/generate_test_data.py"
# DATASET picks the replace map before any token is touched: "visualwebarena"
# is the branch these five tokens come from, "webarena" replaces a different
# seven, and any other value raises ValueError.
dataset = "visualwebarena"
# The keys of that branch's replace_map, in the order the loop takes them.
order = ["__REDDIT__", "__SHOPPING__", "__WIKIPEDIA__", "__CLASSIFIEDS__", "__HOMEPAGE__"]

[instance]
# One record is one task and task_id names it; the loader prefixes the suite, so
# the ids all three VWA files reuse do not collide. Nothing is drawn at run
# time, so the suite enumerates completely out of the file.
key = ["task_id"]
from_file = ["task_id"]
chosen_by_harness = []
# Ids are unique within this file and not across the benchmark.
id_range = "0-465"

[auth]
kind = "storage_state"
# The field that decides which of the two counts below a task lands in. Not
# storage_state: all 466 records name the same path, so a reader that takes a
# non-null storage_state for the answer gives every task the seeded session.
decided_by = "require_login"
# 346 of 466 require the seeded login; every record names the same
# storage_state path regardless. See [accounts].
tasks_with_session = 346
tasks_anonymous = 120
storage_state = "./.auth/shopping_state.json"

# The seeded benchmark accounts, transcribed verbatim from
# upstream/browser_env/env_config.py's ACCOUNTS. They are recorded here because
# the evaluator chain cannot be imported without that module, and because
# scoring reaches for them directly: 116 program_html entries in this suite call
# func:shopping_get_latest_order_url(), which POSTs
# shopping_site_admin's username and password to
# /rest/default/V1/integration/admin/token and uses the returned bearer token.
# The whole table is transcribed, not just this suite's entries, because that is
# what the file contains.
[accounts.shopping]
username = "emma.lopez@gmail.com"
password = "Password.123"

[accounts.shopping_site_admin]
username = "admin"
password = "admin1234"

[accounts.shopping_admin]
username = "admin"
password = "admin1234"

[accounts.reddit]
username = "MarvelsGrantMan136"
password = "test1234"

[accounts.classifieds]
username = "blake.sullivan@gmail.com"
password = "Password.123"

# Present in ACCOUNTS and used by no VWA task; gitlab is a WebArena service.
[accounts.gitlab]
username = "byteblaze"
password = "hello1234"

# There is no in-place reset for this site. env_config.py defines
# CLASSIFIEDS_RESET_TOKEN and REDDIT_RESET_URL and nothing at all for shopping,
# and upstream's environment honours require_reset only for classifieds — for
# every other site it prints a warning and continues against dirty state. The
# published runs got their reset from a wrapper script that recreated the
# container between batches.
[[reset]]
scope = "task"
kind = "none"
contaminates = true
how = "nothing reads require_reset for this site, so without a wrapper the mutations persist into every later task in the run"
# 19 of 466 tasks set require_reset. Nothing reads that field for this site, so
# without a wrapper their mutations persist into every later task in the run.
require_reset_tasks = 19

[[reset]]
scope = "suite"
kind = "container_recreate"
contaminates = false
# In this repo the recovery path for any dirtied state is a fresh container from
# the published image, and there is no vwa/shopping image to recreate. The
# nearest comparable appliance here, images/webarena/shopping, gives its
# HEALTHCHECK a 900 s start period — so whatever this costs, it is a per-batch
# cost and not a per-task one.
how = "recreate the container from the image; nothing restores state in place"
# cost_s is absent because it is not measured, and cannot be measured here while
# no vwa/shopping image exists; an unmeasured number is left out rather than
# guessed, the way build_minutes is in image.toml.

[scoring]
# The four eval_types this suite uses. [scoring.census] counts them and records
# which combinations occur on one task.
evaluator_kinds = ["program_html", "string_match", "url_match", "page_image_query"]
# Every evaluator returns float(bool) and EvaluatorComb multiplies the results,
# so the only two scores this suite can produce are the ends of the range.
reward_range = [0.0, 1.0]
success = "score == 1.0"
# Scorable from a transcript alone: the 129 string_match-only tasks. The other
# 337 call into a live Playwright page, and 106 of them additionally call the
# Magento admin REST API — 116 program_html entries over those 106 tasks — so
# they cannot be re-scored offline from a saved run. The two partition the 466.
offline_scorable = 129
needs_live_page = 337
# Tasks whose scoring calls a judge, LLM or VLM: the 31 fuzzy_match "N/A" answers
# that fall through to llm_ua_match, and the 12 eval_vqa tasks that need a vision
# model. No task is in both sets, so the total is their sum; 98 of the 129
# offline-scorable tasks need no judge either.
needs_judge = 43
aggregate = "mean"
# No task in this suite references an image outside the deployment: scoring
# fetches nothing from the public internet. (The reddit and classifieds suites
# do; see theirs.)
external_references = []

# " |OR| " separates alternatives in band and is split on the exact spaced token; splitting
# on the bare "|OR|" leaves stray spaces inside the alternatives. Which fields upstream
# honours it in is neither uniform nor inferable from the value, so they are listed. A
# splitter applied to every string field scores tasks wrong, and one applied to too few
# scores them wrong the other way.
[scoring.alternatives]
separator = " |OR| "
# Where the separator occurs here: 27 eval.program_html[].required_contents.must_include
# elements, 16 eval.reference_answers.must_include elements, 3 eval.reference_url values —
# all split by the evaluator — and 7 eval.program_html[].locator strings, which the
# evaluator does not split at all. Those 7 are func: arguments, and the helper the locator
# names does the splitting itself: shopping_get_product_attributes splits in the JavaScript
# it injects, shopping_get_order_product_quantity in Python. Splitting a locator before
# eval() therefore corrupts the call.
split_in = [
    "eval.reference_url",
    "eval.reference_answers.must_include[]",
    "eval.reference_answers.required_values[]",
    "eval.program_html[].required_contents.must_include[]",
    "eval.program_html[].required_contents.required_values[]",
    "eval.program_html[].required_contents.fuzzy_match",
    "eval.page_image_query[].eval_fuzzy_image_match",
]
# shopping_get_order_product_name_list JOINS its results with the same token, so a
# must_include element is compared against a string that already contains it.
split_by_the_named_helper = ["eval.program_html[].locator"]
matched_literally_in = []

[scoring.census]
# evaluator_router builds one evaluator per entry in eval.eval_types and
# EvaluatorComb MULTIPLIES their scores, so a task with two types needs both to
# return 1.0. They are not alternatives.
eval_types = { program_html = 293, string_match = 132, url_match = 42, page_image_query = 12 }
eval_type_combinations = [
    "program_html (280)",
    "string_match (129)",
    "url_match (38)",
    "page_image_query (6)",
    "page_image_query + program_html (6)",
    "program_html + url_match (4)",
    "program_html + string_match (3)",
]
# StringEvaluator sub-approaches, counted over reference_answers: must_include
# 100, fuzzy_match 31, one_of 2, and 334 records with reference_answers = null.
# The three do NOT partition the 132 string_match tasks: task 40 carries one_of
# AND must_include on one record and StringEvaluator multiplies both, which is
# why they sum to 133.
#
# All 31 fuzzy_match values are the literal "N/A", so llm_fuzzy_match is never
# reached from this suite — the N/A branch first tries a literal "n/a" match and
# then calls llm_ua_match against eval.string_note. string_note is load-bearing
# for those 31, not a comment; it also sits on 108 further records that nothing
# reads it on.
string_match = { must_include = 100, fuzzy_match_na = 31, one_of = 2 }
# URLExactEvaluator compares page.url to eval.reference_url after clean_url():
# str(), localhost -> 127.0.0.1, strip exactly one trailing slash. If the
# deployment is reached by a name that is neither localhost nor 127.0.0.1, the
# substituted reference and page.url must still agree textually.
#
# The rule is eval.url_note, read as .get("url_note", "EXACT"), so these are
# EFFECTIVE rules and not annotations: 37 of the 42 url_match tasks say "EXACT",
# one says "GOLD in PRED", and tasks 267, 268, 269 and 270 carry no url_note at
# all and take the evaluator's EXACT default. Four further records — 311, 316,
# 317 and 323 — carry a url_note while having no url_match eval type, so nothing
# ever reads it on them.
url_match = { exact = 41, gold_in_pred = 1 }
# HTMLContentExactEvaluator. 332 target entries over 293 tasks, and both halves
# of an entry are executable. The URL: 182 entries navigate to a literal URL, 34
# stay on the last page, and 116 are "func:shopping_get_latest_order_url()",
# which mints a Magento admin REST token before it can even name a page. The
# locator: 144 entries are JavaScript run through page.evaluate, 100 are the
# empty string (the whole page.content()), 73 are func: helpers passed to a bare
# eval(), and 15 are "lambda:" expressions, also evaluated in the page.
# No entry carries prep_actions.
program_html = { entries = 332, must_include = 310, required_values = 17, exact_match = 3, must_exclude = 2 }
# PageImageEvaluator on 12 tasks, and this suite is the VQA half of VWA: all 12
# use eval_vqa (17 questions between them) and none uses eval_fuzzy_image_match,
# so scoring them needs a vision model rather than SSIM. The captioner is
# hardcoded — image_utils.get_captioning_fn raises NotImplementedError for any
# model name without "blip2" in it. 7 queries evaluate the last page; 4 navigate
# to __SHOPPING__/wishlist/ and 1 to __SHOPPING__/catalog/product_compare/,
# which means scoring drives the site after the agent has stopped.
page_image_query = { tasks = 12, vqa = 12, vqa_questions = 17, fuzzy_image_match = 0, ssim_threshold_default = 0.8 }
# The two kinds behind needs_judge: llm_ua_match on the 31, eval_vqa on the 12.
judge_kinds = { llm = 31, vlm = 12 }

# The func: helpers this suite names, with their occurrence counts. The names
# are resolved against helper_functions' module globals by eval(), so this is a
# name-resolution dependency, not a declarative spec: a dispatch table that
# renames or "corrects" any of them breaks the tasks silently.
[scoring.func_helpers]
shopping_get_latest_order_url = 116
get_query_text = 31
shopping_get_order_product_quantity = 11
shopping_get_sku_latest_review_rating = 9
shopping_get_product_attributes = 6
shopping_get_order_product_option = 4
shopping_get_sku_latest_review_author = 4
shopping_get_product_price = 3
shopping_get_sku_latest_review_text = 3
shopping_get_num_reviews = 2

# Both judges in helper_functions pin model = "gpt-4-1106-preview",
# temperature = 0, via llms/providers/openai_utils.py — which is NOT vendored
# here. Neither is browser_env/envs.py, run.py or auto_login.py: this capture
# vendors what scores a task, not what drives one.
[scoring.judge]
model = "gpt-4-1106-preview"
temperature = 0

[requires]
services = ["vwa/shopping", "webarena/wikipedia"]
# images/vwa/ contains exactly one service directory, classifieds. vwa/shopping
# is not built here: no Dockerfile, no dataset pin, no compose entry. Every one
# of the 466 tasks starts on it, so none of them runs today.
not_built = ["vwa/shopping"]
# Built and published but absent from deploy/compose.yml. webarena/wikipedia,
# the only other service these tasks address, is both an images/webarena/
# directory and a deploy/compose.yml service, so nothing here is in that state.
not_deployed = []
# What upstream/browser_env/env_config.py demands before the evaluator chain can
# be imported at all, and it is more than the sites this suite addresses:
#   DATASET                  read as os.environ["DATASET"] on the module's first
#                            line, so an unset value raises KeyError rather than
#                            the AssertionError the other six raise; a value that
#                            is neither "webarena" nor "visualwebarena" raises
#                            ValueError, and only "visualwebarena" takes the
#                            branch that defines CLASSIFIEDS at all;
#   the other six            read with os.environ.get(name, "") and then asserted
#                            non-empty in one `and` chain, so any one of them
#                            missing is an AssertionError that names all six.
# A shopping-only deployment therefore still exports dummy values for REDDIT,
# HOMEPAGE, CLASSIFIEDS and CLASSIFIEDS_RESET_TOKEN. REDDIT_RESET_URL is read the
# same way and is NOT asserted, so it silently stays "".
required_env = [
    "DATASET",
    "REDDIT",
    "SHOPPING",
    "WIKIPEDIA",
    "HOMEPAGE",
    "CLASSIFIEDS",
    "CLASSIFIEDS_RESET_TOKEN",
]
runnable = 0
blocked = 466
# Dependencies are computed from the tokens present in the whole record, not
# from the `sites` field, which is wrong in both directions: three records
# declare sites = ["shopping", "wikipedia"] and only two of them (284 and 345)
# contain __WIKIPEDIA__ — task 319 declares a dependency it does not have.
# Token counts in this file: __SHOPPING__ 809 occurrences over 466 tasks,
# __WIKIPEDIA__ 2 occurrences over 2 tasks.
needs_webarena_wikipedia = [284, 345]

# One entry, because one missing service accounts for every blocked task here.
# task_ids is omitted where the blocked set is the whole suite: a 466-long list
# restates the task file and is free to drift from it.
[[requires.blocked_by]]
service = "vwa/shopping"
tasks = 466

