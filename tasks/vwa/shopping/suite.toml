# The pin this asks about is shared: one [[datasets]] entry in
# tasks/vwa/datasets.toml serves all three suites, so answering this here answers
# it for the other two. The question is recorded per suite — with its own id, and
# the same options — because a manifest that does not name it leaves a reader of
# this suite alone unable to see what the images depend on.
[[open_decisions]]
id = "vwa-dataset-pin-source"
scope = "benchmark"
kind = "dataset_pin"
question = "The input images are pinned as a 206 MB GitHub commit tarball, an object GitHub regenerates on demand. Keep it, or re-host?"
affects = "the one [[datasets]] entry in tasks/vwa/datasets.toml, and so all three VWA suites at once"

[[open_decisions.options]]
id = "keep-tarball-pin"
text = "keep the tarball pin; a regenerated archive fails the checksum loudly and the fleet already fetches from forge-generated archives"

[[open_decisions.options]]
id = "rehost-images-archive"
text = "derive an images-only archive and host it where the salvaged datasets live, which costs a hosting decision and gains a 186 MB object this repo controls"

