affects = "not measured — the tie-dependence of a task is not visible in its record; TODO.md carries the question for the whole fleet"

[[open_decisions.options]]
id = "accept-permutations"
text = "accept any permutation within a rank tie when scoring"

[[open_decisions.options]]
id = "secondary-sort"
text = "pin a deterministic secondary sort in each app"

[[open_decisions.options]]
id = "document-instability"
text = "accept the instability and document it per benchmark"
