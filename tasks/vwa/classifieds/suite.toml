question = "Which model scores the 10 unachievable-task answers that fall through to llm_ua_match?"
affects = "10 of 234 tasks"
affects_tasks = 10

[[open_decisions.options]]
id = "upstream-gpt4"
text = "gpt-4-1106-preview at temperature 0, the model helper_functions pins, to reproduce published numbers"

[[open_decisions.options]]
id = "current-model"
text = "a current model, for a judge that stays available and stable in house, at the cost of comparability"

[[open_decisions]]
id = "vwa-classifieds-fuzzy-image-reference"
scope = "suite"
kind = "image_reference"
