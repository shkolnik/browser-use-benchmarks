question = "This repo builds webarena/shopping from shopping_final_0712.tar and webarena/reddit from postmill-populated-exposed-withimg.tar — the artifacts VWA's SHOPPING and REDDIT services are also built from. Do they stand in for vwa/shopping and vwa/reddit?"
affects = "13 of 234 tasks here, and the whole 466-task shopping and 210-task reddit suites"
affects_tasks = 13

[[open_decisions.options]]
id = "substitute-webarena"
text = "yes: point __SHOPPING__ and __REDDIT__ at the webarena services and run the 13 cross-site tasks, once someone verifies the referenced item pages exist there"

[[open_decisions.options]]
id = "leave-unrunnable"
text = "no: leave the 13 tasks unrunnable until vwa/shopping and vwa/reddit are built as their own images"

# The pin this asks about is shared: one [[datasets]] entry in
# tasks/vwa/datasets.toml serves all three suites, so answering this here answers
# it for the other two. The question is recorded per suite — with its own id, and
# the same options — because a manifest that does not name it leaves a reader of
# this suite alone unable to see what the images depend on.
[[open_decisions]]
