# Ordering hint only: CI enqueues the build matrix longest-first, so a
# wrong number here costs queue position and never correctness.
# Measured.
build_minutes = 27

# WebShop — Flask app over ~1.18M scraped Amazon products.
# Built from OUR FORK, shkolnik/WebShop, pinned at d8c8dc1b0605f86a5d734b37245abff857da38aa
# (master, 2026-08-07 = upstream princeton-nlp 64fa2a5 plus shkolnik/WebShop#1, which moves
# the corpus parse to build time). Dataset provenance + deviations: see README.md.

[[datasets]]
filename = "webshop-src-d8c8dc1.tar.gz"
sha256 = "bc0e4d2f526dea4290dbcbf2f225c7a1c631eeb5bc09e49082877b7d22acd5ab"
urls = ["https://github.com/shkolnik/WebShop/archive/d8c8dc1b0605f86a5d734b37245abff857da38aa.tar.gz"]
# Computed in this repo (curl + sha256sum). GitHub commit archives are stable per commit
# in practice; a checksum break means GitHub changed its tar generation — investigate,
# don't bump this value blindly. (Same caveat as miniwob's tag archive.)
# Fetching a fork rather than upstream changes nothing about the trust model: the pin is a
# commit hash either way, and `git remote -v` in the fork still names princeton-nlp as
# upstream. Rebasing onto a newer upstream is a normal fork merge + a new pin here.

[[datasets]]
filename = "items_shuffle.json"
sha256 = "2ef591d65df3af89e972ab72468eb82cbf124d876552d9f3678667edd620a6c8"
urls = [
  "https://huggingface.co/datasets/YWZBrandon/webshop-data/resolve/main/items_shuffle.json",
  "https://huggingface.co/datasets/HongbangYuan/webshop/resolve/main/items_shuffle.json",
  "https://huggingface.co/datasets/Yuxuan13/webshop_dataset/resolve/main/items_shuffle.json",
]
prepare_input = true
# ~5.1G (5,479,720,229 bytes). Upstream canonical source is Google Drive (gdown id
# 1A2whVgOO0euk5O13n2iYDM0bQRkkRduB in WebShop's setup.sh) — not curl-fetchable. The
# sha256 here is the LFS oid reported identically by all three independent HF mirrors,
# and was confirmed by a completed local download on 2026-08-05.

[[datasets]]
filename = "items_ins_v2.json"
sha256 = "1d36af476bdb8f82a5da62bd8acdabe54cd8de2fa84010d37da5c4890feb447e"
urls = [
  "https://huggingface.co/datasets/YWZBrandon/webshop-data/resolve/main/items_ins_v2.json",
  "https://huggingface.co/datasets/HongbangYuan/webshop/resolve/main/items_ins_v2.json",
  "https://huggingface.co/datasets/Yuxuan13/webshop_dataset/resolve/main/items_ins_v2.json",
]
prepare_input = true
# ~178M (186,295,270 bytes). Same provenance story as items_shuffle.json (upstream gdown
# id 1s2j6NgHljiZzQNL3veZaAiyW_qDEgBNi); sha256 = LFS oid, identical on all three
# mirrors, confirmed by a completed local download on 2026-08-05.

[[datasets]]
filename = "items_human_ins.json"
sha256 = "cf78667548a71786e1d9049c24b802e48e1084ad4bb021cae56ce1f6d96954a3"
urls = [
  "https://huggingface.co/datasets/YWZBrandon/webshop-data/resolve/main/items_human_ins.json",
  "https://huggingface.co/datasets/HongbangYuan/webshop/resolve/main/items_human_ins.json",
]
prepare_input = true
# ~4.9M. Computed in this repo after downloading from BOTH mirrors — byte-identical.
# Upstream gdown id 14Kb5SPBk_jfdLZ_CDBNitW98QLDlKR5O.

[[datasets]]
filename = "en_core_web_sm-3.3.0.tar.gz"
sha256 = "348aa7a0afc04ef52b2f63a9de29a9bcc4463260f023b2814ff506214d9476ae"
urls = ["https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.3.0/en_core_web_sm-3.3.0.tar.gz"]
# ~12M, computed in this repo. goal.py does spacy.load("en_core_web_sm") at import time
# (setup.sh downloads en_core_web_lg, but the served app only loads _sm). Shipping it as
# a checksummed dataset keeps the model install off the network path.

# webshop derives nothing — its data is published as data — so this step is a
# verified GHCR mirror of the bulk input rather than a derivation. It buys the
# same two things a derive step buys elsewhere: a cold runner pulls from the
# registry we control instead of a third-party mirror, and the runner's copy
# becomes reclaimable. ALL THREE product files are covered deliberately:
# leaving even the 4.9M one outside would keep HuggingFace on the critical path
# and make this not a checkpoint you can rebuild forward from. See
# derive-backup.sh for what is NOT cached (the Lucene index the Dockerfile
# builds over all ~1.18M products).
[prepare]
script = "derive-backup.sh"
outputs = ["items_shuffle.json", "items_ins_v2.json", "items_human_ins.json"]

[service]
# The PUBLISHED address the smoke gate reaches this service at. Readiness is the
# Dockerfile HEALTHCHECK's job — see the long comment beside it for the measured
# first-request load (1.5s to first response, 5.2s to docker-healthy on the fork,
# against 57s and ~19G RSS before it) that sets its --timeout.
healthcheck = "http://localhost:3000/"
