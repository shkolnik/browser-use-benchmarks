# The two processes upstream ran as two compose containers, now side by side.
# Included by Debian's /etc/supervisor/supervisord.conf, which already provides
# the [supervisord], [unix_http_server], [supervisorctl] and [rpcinterface]
# sections — so `supervisorctl status` works here without re-declaring them
# (reddit's image had to add them by hand; this base ships them).

# The datadir was populated at BUILD time, so this is a plain start: no initdb,
# no dump load, no entrypoint script.
[program:mysqld]
command=/usr/sbin/mysqld --user=mysql --datadir=/var/lib/mysql --skip-networking
user=root
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# PHP's built-in server, which is what upstream serves with — no nginx or apache
# anywhere in the upstream image. It handles one request at a time; upstream has
# the same property, and PHP_CLI_SERVER_WORKERS is the knob if that ever needs
# revisiting.
[program:php]
command=/usr/local/bin/php -S 0.0.0.0:9980
directory=/usr/src/myapp
user=www-data
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
