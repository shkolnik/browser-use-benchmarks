version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # Scope is this repo's own tooling only. There is deliberately no docker
  # entry: the service images under images/ pin old — in several cases
  # end-of-life — base images on purpose, because an agent's score is a
  # function of the exact bytes a page serves and a base-image bump moves
  # them. SECURITY.md has the reasoning and the worked examples.
  #
  # This file governs version-update pull requests only. Dependabot ALERTS are
  # raised from the dependency graph regardless of what is listed here, so the
  # composer.lock files under images/webarena/shopping{,-admin}/ still produce
  # them; silence those with an auto-triage rule or by dismissing them, not
  # here.
  #
  # No pip entry: builder/ is deliberately stdlib-only (no requirements
  # files to track), and WebShop's python deps are pinned by its upstream
  # repo, not by files in this one.
