name: build-images
# Dispatched runs otherwise all display as "build-images"; an empty run-name
# falls back to the default (push runs keep their commit-message title).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('build {0}', inputs.target) || '' }}

# One RUN at a time. This is not what serialized the matrix — `max-parallel`
# was, and it is gone (see the build job) — so this costs the burst fan-out
# nothing: jobs within a run still start together.
#
# Its original reason (two runs racing on the home runner's shared datasets
# cache, appending the same .part download) does die with per-job VMs. It is
# kept for a second reason that does not: two runs of the same ref would each
# `bin/build push` the same image to `:latest` and then attest whatever their
# own `docker inspect` resolved locally, so the losing run can stamp a
# provenance attestation onto a digest that is no longer what `:latest` points
# at. Serializing runs is the cheap way to keep the published digest and its
# attestation the same object.
#
# Queue, never cancel — every push's build must actually run so its commit
# status is truthful.
concurrency:
  group: build-images
  cancel-in-progress: false

# GITHUB_TOKEN scopes: the default token couldn't push to ghcr (the first
# run's push step was denied 5/5 attempts) — packages:write must be explicit.
# id-token + attestations are for the provenance attestation step.
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  actions: read   # discover reads the last successful run's head SHA

on:
  workflow_dispatch:
    inputs:
      target:
        description: "all, <benchmark>, or <benchmark>/<service>"
        default: all
      # #42: builder/derived-cache.lock pins the digests six derive scripts
      # depend on, so a miss on a pinned entry fails the build rather than
      # silently re-deriving. This input exists only for a GHCR outage —
      # leave it false otherwise, since a real miss should fail loudly.
      allow_derive_cache_miss:
        description: "Downgrade a pinned derived-cache miss to a warning (GHCR outage escape hatch)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["images/**", "builder/**", "bin/**", ".github/workflows/build.yml"]

# Push builds are change-scoped: an image rebuilds only when its own
# images/<name>/ directory — or a shared input (builder/, bin/, this file) —
# changed since the last successful push build. The original "layer cache makes no-change
# rebuilds cheap" premise broke on gitlab: its ~50G of build layers never
# survive the post-job `builder prune --reserved-space 20GB`, so every push
# paid the full ~70-minute restore stage. Consequence to be aware of: a
# green push status now attests only the images that push touched.
# workflow_dispatch keeps explicit-target semantics (`all` really means all).

jobs:
  discover:
    # Deliberately NOT `[self-hosted, burst]`: this job is a checkout, a `git
    # diff` and one `gh` call, and spending a whole ephemeral VM on it would add
    # boot latency to every run for no gain. It stays on the home runner.
    #
    # Caveat worth knowing: every self-hosted runner carries the implicit
    # `self-hosted` label, burst VMs included, so an idle burst VM COULD pick
    # this up. Harmless (the job is cheap and needs nothing runner-specific),
    # and burst never boots a VM for it, since only `burst`-labeled jobs are
    # counted. Give the home runner a distinguishing label and name it here if
    # that ever needs to be airtight.
    runs-on: self-hosted
    outputs:
      images: ${{ steps.ls.outputs.images }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Change-detection diffs against the pre-push SHA, which a
          # depth-1 clone doesn't have.
          fetch-depth: 0
      - id: ls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target='${{ github.event.inputs.target || 'all' }}'
          # The probe benchmark (images/probe/synthetic) has no [[datasets]]
          # (data is generated locally, not downloaded) and no [service]
          # healthcheck (it isn't a runnable service) — `build`/`smoke` are
          # not CI-safe for it, so it's excluded here by name. This is the
          # workflow's own concern, not a root index: removing the probe
          # later means deleting its directory AND this one grep line.
          #
          # Low-tech enablement (James, 2026-08-05): images not yet converted
          # to a provenance-clear build are excluded below; enabling one =
          # deleting its exclude line. Everything else builds on push and
          # reports commit status.
          enabled=$(bin/build list "$target" | cut -f1 \
            | grep -v '^probe/')
          test -n "$enabled"   # fail loudly if discovery itself found nothing

          if [ '${{ github.event_name }}' = push ]; then
            # Diff against the last SUCCESSFUL push build, not event.before:
            # the concurrency group keeps only one pending run, so a queued
            # run can be superseded before it ever ran — its commits would
            # vanish from an event.before diff and never build. Anchoring on
            # the last green run keeps every change in scope until a run
            # actually builds it (and retries failed images on the next push).
            base=$(gh run list --workflow build-images --branch main --event push \
              --status success --limit 1 --json headSha -q '.[0].headSha' || true)
            if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
              echo "no usable base '$base': building all"
            else
              changed=$(git diff --name-only "$base" '${{ github.sha }}')
              if echo "$changed" | grep -qE '^(builder/|bin/|\.github/workflows/build\.yml)'; then
                echo "shared build inputs changed: building all"
              else
                enabled=$(echo "$enabled" \
                  | while read -r img; do
                      echo "$changed" | grep -q "^images/$img/" && echo "$img"
                    done; true)
              fi
            fi
          fi

          images=$(printf '%s\n' "$enabled" \
            | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "discovered: $images"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    # A push can legitimately touch no enabled image (e.g. only an excluded
    # one); skip instead of handing the matrix an empty list.
    if: needs.discover.outputs.images != '[]'
    # One ephemeral AWS VM per matrix job, booted by burst-actions (burst.toml).
    # Both labels are load-bearing and exact: burst's `--auto` decides how many
    # VMs to boot by counting queued jobs that carry `burst`. Until the operator
    # has burst running against this repo, jobs here simply sit queued.
    runs-on: [self-hosted, burst]
    # Without this the job inherits GitHub's 6h default. Twice on 2026-08-06 a
    # job stopped making progress and kept the `build-images` concurrency slot,
    # so every queued image waited on a job that was doing nothing — once as a
    # server-side kill, once as a ghost whose runner was gone entirely. The
    # ceiling is generous on purpose: the longest legitimate build measured is
    # classifieds at 85min, and shopping's first uncached derive is expected to
    # run longer still, so this bounds the stall without threatening real work.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # No max-parallel. It used to read "one huge build at a time; the disk is
      # the constraint" — true when every image shared one runner's disk, and
      # false now that each job gets its own single-tenant VM. Removing it is
      # the whole point of the burst move: the fleet's wall-clock drops from the
      # SUM of the image build times to the slowest single image. The disk
      # constraint did not disappear, it moved: it is now a per-VM volume-size
      # requirement, documented in docs/burst-runners.md.
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@v7
      - name: login to ghcr
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      # NOT cached any more. This used to say "(cached on runner)" and that was
      # the home runner's persistent $HOME; a burst VM is created for this job
      # and destroyed after it, so --datasets-dir starts empty every time and
      # every build is cold, docker layer cache included. The expensive misses
      # this could hide are exactly the ones builder/derived-cache.lock now
      # covers from GHCR, which is why cold builds are affordable at all —
      # wikipedia's uncached path is a ~24-hour, ~89 GiB upstream fetch.
      - name: download datasets
        run: bin/build download '${{ matrix.image }}' --datasets-dir "$HOME/benchmark-datasets"
      - name: build
        # ALLOW_DERIVE_CACHE_MISS: builder/stage-lib/derive-cache.sh's dcache_require
        # reads this (must be exactly "1" to take effect). workflow_dispatch's
        # boolean input arrives as the string "true"/"false"; translate here
        # rather than in the library, so the library's contract stays a plain
        # env var and doesn't have to know about Actions' input encoding. On
        # a push event there is no dispatch input at all, so this evaluates
        # to empty — the default, fail-loud behavior.
        env:
          ALLOW_DERIVE_CACHE_MISS: ${{ github.event.inputs.allow_derive_cache_miss == 'true' && '1' || '' }}
        run: bin/build build '${{ matrix.image }}' --datasets-dir "$HOME/benchmark-datasets"
      # BEFORE push, deliberately: a green build proves the image assembled,
      # not that it serves. The reddit rebuild assembled cleanly and 404'd on
      # every page (a partitioner bug nested the document root one level
      # deeper), and nothing in this pipeline would have noticed — it would
      # have published, attested, and reported success. Each image's
      # [service].healthcheck points at a real content page rather than a
      # liveness stub, so poll_health's 200-399 window catches exactly that
      # class. Smoke runs on every event, including the pull-request path that
      # never pushes, because "does it boot" is worth knowing there too.
      - name: smoke — boot the built image before publishing it
        run: bin/build smoke '${{ matrix.image }}'
      - name: push
        if: github.event_name == 'push' || github.event.inputs.target != ''
        run: bin/build push '${{ matrix.image }}'
      - name: resolve pushed digest
        id: digest
        if: github.event_name == 'push' || github.event.inputs.target != ''
        run: |
          name="ghcr.io/${{ github.repository_owner }}/$(echo '${{ matrix.image }}' | tr / -)"
          # RepoDigests is populated by the push above; with a single registry
          # there is exactly one entry.
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$name:latest" | cut -d@ -f2)
          echo "resolved: $name@$digest"
          case "$digest" in sha256:*) ;; *) echo "no digest resolved" >&2; exit 1;; esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # Signed SLSA build provenance: lets anyone verify the image came from
      # this repo's CI at a given commit, via
      #   gh attestation verify oci://<image> -R ${{ github.repository }}
      # push-to-registry also attaches it to the image as an OCI referrer.
      # GHCR does not authorize a BRAND-NEW package the instant its first push
      # completes, and attestation is the first thing to ask. Run 31095455745
      # created the webarena-shopping package at 12:45:15Z and attestation died
      # 5s later on `403` fetching a pull-scope token; shopping-admin survived
      # the identical race only because it asked 11s after its own first push.
      # Nothing was wrong with the token or its permissions. So wait for the
      # registry to agree the package is readable, and fail loudly if it never
      # does — a silently skipped attestation would leave an image published
      # with no provenance, which is the one thing this pipeline exists to
      # guarantee. Costs nothing on the every-other-run path: an already-known
      # package answers 200 on the first poll.
      - name: wait for ghcr to authorize the package
        if: github.event_name == 'push' || github.event.inputs.target != ''
        env:
          SUBJECT_NAME: ${{ steps.digest.outputs.name }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${SUBJECT_NAME#ghcr.io/}"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "x:$GHCR_TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:${repo}:pull")
            if [ "$code" = 200 ]; then
              echo "ghcr authorized ${repo} after $(( (i - 1) * 5 ))s"
              exit 0
            fi
            echo "ghcr not ready for ${repo} (HTTP $code) — attempt $i/30"
            sleep 5
          done
          echo "ghcr never authorized ${repo} within 150s (last HTTP $code)" >&2
          exit 1

      - name: attest build provenance
        if: github.event_name == 'push' || github.event.inputs.target != ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.digest.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # Disk hygiene: the runner VM's disk is the scarce resource, so every
      # job leaves docker the way it found it — only the datasets cache
      # ($HOME/benchmark-datasets) and a bounded builder cache persist.
      # always() so a failed build's partial images still get reclaimed.
      #
      # On a burst VM this and the prune below are near no-ops — the whole
      # machine is discarded minutes later. Kept anyway: they cost seconds, they
      # are what makes this workflow still correct if a job is ever run on the
      # home runner again, and a build that dies with 200 GiB of layers on a VM
      # that outlives it by a TTL window is not a hypothetical worth inviting.
      - name: clean up images
        if: always()
        run: bin/build clean '${{ matrix.image }}'
      # No `docker system df` here. It reported nothing the job acted on, and
      # it walks every image, volume and cache entry to size them — which on
      # this runner's ~400G of images intermittently hung, failing jobs at the
      # finish line after the build and smoke had already passed. A step that
      # only logs must not be able to fail a job.
      - name: clean up docker leftovers
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --reserved-space 20GB
