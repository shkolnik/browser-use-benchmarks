name: build-images

# GITHUB_TOKEN scopes: the default token couldn't push to ghcr (the first
# run's push step was denied 5/5 attempts) — packages:write must be explicit.
permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      target:
        description: "all, <benchmark>, or <benchmark>/<service>"
        default: all
  push:
    branches: [main]
    paths: ["images/**", "builder/**", "bin/**", ".github/workflows/build.yml"]

# v1 deliberately does NOT implement change-detection on push: the download
# cache (datasets/ persists on the self-hosted runner) plus docker's own
# layer cache make a no-change rebuild cheap, and skipping change-detection
# keeps this workflow index-free (glob discovery only, per design.md).
# Revisit only if rebuild time actually becomes a problem.

jobs:
  discover:
    runs-on: self-hosted
    outputs:
      images: ${{ steps.ls.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - id: ls
        run: |
          target='${{ github.event.inputs.target || 'all' }}'
          # The probe benchmark (images/probe/synthetic) has no [[datasets]]
          # (data is generated locally, not downloaded) and no [service]
          # healthcheck (it isn't a runnable service) — `build`/`smoke` are
          # not CI-safe for it, so it's excluded here by name. This is the
          # workflow's own concern, not a root index: removing the probe
          # later means deleting its directory AND this one grep line.
          # TEMPORARY (first-run shakeout, 2026-08-05): only miniwob/server —
          # the smallest image — until the runner setup is proven. Remove the
          # override below to restore full discovery.
          target='miniwob/server'
          images=$(bin/build list "$target" | cut -f1 | grep -v '^probe/' \
            | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "discovered: $images"
          test "$images" != "[]"   # fail loudly instead of handing build an empty matrix
          echo "images=$images" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: self-hosted
    strategy:
      fail-fast: false
      max-parallel: 1   # one huge build at a time; the disk is the constraint
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - name: login to ghcr
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: download datasets (cached on runner)
        run: bin/build download '${{ matrix.image }}' --datasets-dir "$HOME/benchmark-datasets"
      - name: build
        run: bin/build build '${{ matrix.image }}' --datasets-dir "$HOME/benchmark-datasets"
      - name: push
        if: github.event_name == 'push' || github.event.inputs.target != ''
        run: bin/build push '${{ matrix.image }}'

      # Disk hygiene: the runner VM's disk is the scarce resource, so every
      # job leaves docker the way it found it — only the datasets cache
      # ($HOME/benchmark-datasets) and a bounded builder cache persist.
      # always() so a failed build's partial images still get reclaimed.
      - name: clean up images
        if: always()
        run: bin/build clean '${{ matrix.image }}'
      - name: clean up docker leftovers
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --keep-storage 20GB
          docker system df
